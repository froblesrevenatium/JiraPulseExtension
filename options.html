<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Configuración — Jira My Tasks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #f4f5f7;
      color: #172b4d;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 16px;
    }
    form, section {
      background: #fff;
      border-radius: 4px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    h1 { font-size: 18px; color: #0052cc; }
    section { gap: 12px; }
    h2 { font-size: 16px; color: #0052cc; }
    #status-list { display: flex; flex-direction: column; gap: 8px; }
    #status-list label { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; }
    .status-count { color: #6b778c; font-size: 12px; }
    #status-empty { font-size: 13px; color: #6b778c; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; }
    input {
      padding: 8px 10px;
      border: 1px solid #dfe1e6;
      border-radius: 3px;
      font-size: 13px;
      color: #172b4d;
      outline: none;
    }
    input:focus { border-color: #0052cc; }
    small { font-weight: 400; font-size: 12px; color: #6b778c; }
    button {
      padding: 9px;
      background: #0052cc;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #0065ff; }
    #status { font-size: 13px; color: #36b37e; min-height: 18px; }
  </style>
</head>
<body>
  <form id="options-form">
    <h1>Configuración de Jira</h1>
    <label>
      Dominio
      <input type="text" id="domain" placeholder="tuempresa.atlassian.net" />
    </label>
    <label>
      Email
      <input type="email" id="email" placeholder="tu@email.com" />
    </label>
    <label>
      API Token
      <input type="password" id="token" placeholder="ATATT3x..." />
    </label>
    <label>
      Días de tareas finalizadas
      <input type="number" id="done-days" min="1" max="365" step="1" />
      <small>Rango de tiempo de la sección Finalizadas (1 a 365 días).</small>
    </label>
    <button type="submit">Guardar</button>
    <span id="status"></span>
  </form>
  <section id="statuses">
    <h2>Estatus visibles</h2>
    <small>Desmarca un estatus para ocultar sus tareas del popup y del conteo del badge. Solo aparecen los estatus de tus tareas actuales. Se guarda al instante.</small>
    <div id="status-list"></div>
    <p id="status-empty" hidden>Aún no hay tareas cargadas. Guarda la configuración de Jira para ver los estatus.</p>
  </section>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
